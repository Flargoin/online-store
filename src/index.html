<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интернет-магазин | Каталог товаров</title>
  </head>
  <body>
    <header class="header">
      <a href="/" class="logo"> Internet-shop </a>
      <nav class="header-triggers">
        <a href="/" class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M5 19V8.1L3.242 4.235l.916-.427L6.085 8.05h11.83l1.927-4.242l.916.427L19 8.1V19H5Zm5-6.5h4q.213 0 .356-.144q.144-.144.144-.357t-.144-.356Q14.213 11.5 14 11.5h-4q-.213 0-.356.144q-.144.144-.144.357t.144.356q.144.143.356.143ZM6 18h12V9.05H6V18Zm0 0V9.05V18Z"
            />
          </svg>
          Orders
        </a>

        <a href="/favorites" class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 21 21">
            <path
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 6.5c.5-2.5 4.343-2.657 6-1c1.603 1.603 1.5 4.334 0 6l-6 6l-6-6a4.243 4.243 0 0 1 0-6c1.55-1.55 5.5-1.5 6 1z"
            />
          </svg>
          Favorites
        </a>

        <a href="/cart" class="trigger">
          <div class="trigger__counter">
            <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M0 1h4.764l.545 2h18.078l-3.666 11H7.78l-.5 2H22v2H4.72l1.246-4.989L3.236 3H0V1Zm7.764 11h10.515l2.334-7H5.855l1.909 7ZM4 21a2 2 0 1 1 4 0a2 2 0 0 1-4 0Zm14 0a2 2 0 1 1 4 0a2 2 0 0 1-4 0Z"
              />
            </svg>
            <div class="counter">1</div>
          </div>
          Cart
        </a>
      </nav>
      <button class="burger">
        <span></span>
      </button>
    </header>

    <main class="content"></main>

    <dialog id="myDialog" class="modal">
      <div class="modal__head">
        <div class="modal__head-title h2">Фильтры</div>
        <button id="close" type="button" onclick="window.myDialog.close()">&times;</button>
      </div>
      <div class="modal__head-content">
        <div class="filters__item filters-price">
          <details class="control__column">
            <summary class="filters-price__title">Price</summary>

            <div class="control__content">
              <div class="filters-price__inputs">
                <div class="filters-price__block">
                  <input
                    type="text"
                    minlength="3"
                    maxlength="7"
                    value="100"
                    class="filters-price__input"
                    data-price-min
                  />
                </div>
                <div class="filters-price__block">
                  <input
                    type="text"
                    minlength="3"
                    maxlength="7"
                    value="600"
                    class="filters-price__input"
                    data-price-max
                  />
                </div>
              </div>
            </div>
          </details>
        </div>

        <div class="filters__item filters-categories">
          <details class="control__column">
            <summary class="filters-price__title">Categories</summary>
            <div class="control__content">
              <div class="filters-has__group control__group">
                <input
                  id="has-other"
                  type="checkbox"
                  class="filters-has__input"
                  value="tv"
                  checked
                />
                <label for="has-other" class="filters-has__label">TV</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-yes" type="checkbox" class="filters-has__input" value="audio" />
                <label for="has-yes" class="filters-has__label">Audio</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="laptop" />
                <label for="has-no" class="filters-has__label">Laptop</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="mobile" />
                <label for="has-no" class="filters-has__label">Mobile</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="gaming" />
                <label for="has-no" class="filters-has__label">Gaming</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="appliances" />
                <label for="has-no" class="filters-has__label">Appliances</label>
              </div>
            </div>
          </details>
        </div>

        <div class="filters__item filters-categories">
          <details class="control__column">
            <summary class="filters-price__title">Brands</summary>
            <div class="control__content">
              <div class="filters-has__group control__group">
                <input
                  id="has-other"
                  type="checkbox"
                  class="filters-has__input"
                  value="tv"
                  checked
                />
                <label for="has-other" class="filters-has__label">TV</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-yes" type="checkbox" class="filters-has__input" value="audio" />
                <label for="has-yes" class="filters-has__label">Audio</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="laptop" />
                <label for="has-no" class="filters-has__label">Laptop</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="mobile" />
                <label for="has-no" class="filters-has__label">Mobile</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="gaming" />
                <label for="has-no" class="filters-has__label">Gaming</label>
              </div>

              <div class="filters-has__group control__group">
                <input id="has-no" type="checkbox" class="filters-has__input" value="appliances" />
                <label for="has-no" class="filters-has__label">Appliances</label>
              </div>
            </div>
          </details>
        </div>
      </div>
    </dialog>
  </body>
</html>
