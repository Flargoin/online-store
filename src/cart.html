<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интернет магазин | Корзина</title>
  </head>
  <body>
    <header class="header">
      <a class="logo"> Internet-shop </a>
      <div class="header-triggers">
        <button class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M5 19V8.1L3.242 4.235l.916-.427L6.085 8.05h11.83l1.927-4.242l.916.427L19 8.1V19H5Zm5-6.5h4q.213 0 .356-.144q.144-.144.144-.357t-.144-.356Q14.213 11.5 14 11.5h-4q-.213 0-.356.144q-.144.144-.144.357t.144.356q.144.143.356.143ZM6 18h12V9.05H6V18Zm0 0V9.05V18Z"
            />
          </svg>
          Заказы
        </button>

        <button class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 21 21">
            <path
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 6.5c.5-2.5 4.343-2.657 6-1c1.603 1.603 1.5 4.334 0 6l-6 6l-6-6a4.243 4.243 0 0 1 0-6c1.55-1.55 5.5-1.5 6 1z"
            />
          </svg>
          Избранное
        </button>

        <button class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M0 1h4.764l.545 2h18.078l-3.666 11H7.78l-.5 2H22v2H4.72l1.246-4.989L3.236 3H0V1Zm7.764 11h10.515l2.334-7H5.855l1.909 7ZM4 21a2 2 0 1 1 4 0a2 2 0 0 1-4 0Zm14 0a2 2 0 1 1 4 0a2 2 0 0 1-4 0Z"
            />
          </svg>
          Корзина
        </button>
      </div>
    </header>
    <main class="main">
      <section class="section cart">
        <div class="container">
          <div class="section__header">
            <h2 class="title h2">Cart</h2>
          </div>

          <div class="cart__inner">
            <ul class="cart__list">
              <li class="cart__item">
                <div class="cart__item-img">
                  <img
                    src="https://media.istockphoto.com/id/1361595256/ru/%D1%84%D0%BE%D1%82%D0%BE/%D0%B2%D0%B8%D0%B4-%D1%81%D0%BF%D0%B5%D1%80%D0%B5%D0%B4%D0%B8-%D1%80%D0%B0%D0%B1%D0%BE%D1%87%D0%B5%D0%B3%D0%BE-%D0%BF%D1%80%D0%BE%D1%81%D1%82%D1%80%D0%B0%D0%BD%D1%81%D1%82%D0%B2%D0%B0-%D1%81%D0%BE%D0%B2%D1%80%D0%B5%D0%BC%D0%B5%D0%BD%D0%BD%D0%BE%D0%B3%D0%BE-%D0%BA%D0%BE%D0%BC%D0%BF%D1%8C%D1%8E%D1%82%D0%B5%D1%80%D0%B0-%D0%BF%D1%83%D1%81%D1%82%D0%BE%D0%B9-%D1%8D%D0%BA%D1%80%D0%B0%D0%BD-%D0%BC%D0%B0%D0%BA%D0%B5%D1%82%D0%B0.jpg?s=1024x1024&w=is&k=20&c=10RF1jQIXyg4aou_UFEg-ijOH7_8U6k4l2ygeC2ZHH0="
                    alt="#"
                    loading="lazy"
                    decoding="async"
                  />
                </div>

                <div class="cart__item-info">
                  <h3 class="h3 cart__item-info-title">
                    Sony WH-1000XM3 Bluetooth Wireless Over Ear Headphones with Mic (Silver)
                  </h3>

                  <div class="cart__item-info-price price">
                    <div class="price__current"><span>300</span>$</div>
                    <div class="price__old"><span>350</span>$</div>
                  </div>

                  <div class="cart__item-info-trigger cart__triggers">
                    <button class="cart__triggers-favorite">
                      <svg
                        width="800px"
                        height="800px"
                        viewBox="0 0 24 24"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          fill-rule="evenodd"
                          clip-rule="evenodd"
                          d="M12 6.00019C10.2006 3.90317 7.19377 3.2551 4.93923 5.17534C2.68468 7.09558 2.36727 10.3061 4.13778 12.5772C5.60984 14.4654 10.0648 18.4479 11.5249 19.7369C11.6882 19.8811 11.7699 19.9532 11.8652 19.9815C11.9483 20.0062 12.0393 20.0062 12.1225 19.9815C12.2178 19.9532 12.2994 19.8811 12.4628 19.7369C13.9229 18.4479 18.3778 14.4654 19.8499 12.5772C21.6204 10.3061 21.3417 7.07538 19.0484 5.17534C16.7551 3.2753 13.7994 3.90317 12 6.00019Z"
                          stroke="#000000"
                          stroke-width="1"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </button>
                    <button class="cart__triggers-delete">
                      <svg
                        width="800px"
                        height="800px"
                        viewBox="0 0 24 24"
                        fill="none"
                        xmlns="http://www.w3.org/2000/svg"
                      >
                        <path
                          d="M10 11V17"
                          stroke="#000000"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M14 11V17"
                          stroke="#000000"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M4 7H20"
                          stroke="#000000"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M6 7H12H18V18C18 19.6569 16.6569 21 15 21H9C7.34315 21 6 19.6569 6 18V7Z"
                          stroke="#000000"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                        <path
                          d="M9 5C9 3.89543 9.89543 3 11 3H13C14.1046 3 15 3.89543 15 5V7H9V5Z"
                          stroke="#000000"
                          stroke-width="2"
                          stroke-linecap="round"
                          stroke-linejoin="round"
                        />
                      </svg>
                    </button>
                  </div>
                </div>

                <div class="cart__item-info-stepper cart__stepper stepper">
                  <label class="stepper__field">
                    <input type="text" value="1" maxlength="3" class="stepper__input" />
                    <span class="stepper__tex">pcs</span>
                  </label>
                  <div class="stepper__btns">
                    <button class="stepper__btn stepper__btn--up" aria-label="Plus one">+</button>
                    <button class="stepper__btn stepper__btn--down" aria-label="Minus one">
                      -
                    </button>
                  </div>
                </div>
              </li>
            </ul>

            <div class="cart__total">
              <div class="cart__total-block">
                <h3 class="h3 cart__total-title">Total:</h3>
                <dl class="chars">
                  <div class="chars__item">
                    <dt class="chars__term">Items</dt>
                    <dd class="chars__val">1</dd>
                  </div>
                  <div class="chars__item">
                    <dt class="chars__term">Discount</dt>
                    <dd class="chars__val">10%</dd>
                  </div>
                </dl>
                <button class="btn">Checkout</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
