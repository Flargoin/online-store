<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Интернет магазин | Корзина</title>
  </head>
  <body>
    <header class="header">
      <a class="logo"> Internet-shop </a>
      <div class="header-triggers">
        <button class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
            <path
              fill="currentColor"
              d="M5 19V8.1L3.242 4.235l.916-.427L6.085 8.05h11.83l1.927-4.242l.916.427L19 8.1V19H5Zm5-6.5h4q.213 0 .356-.144q.144-.144.144-.357t-.144-.356Q14.213 11.5 14 11.5h-4q-.213 0-.356.144q-.144.144-.144.357t.144.356q.144.143.356.143ZM6 18h12V9.05H6V18Zm0 0V9.05V18Z"
            />
          </svg>
          Orders
        </button>

        <button class="trigger">
          <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 21 21">
            <path
              fill="none"
              stroke="currentColor"
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M10.5 6.5c.5-2.5 4.343-2.657 6-1c1.603 1.603 1.5 4.334 0 6l-6 6l-6-6a4.243 4.243 0 0 1 0-6c1.55-1.55 5.5-1.5 6 1z"
            />
          </svg>
          Favorites
        </button>

        <button class="trigger">
          <div class="trigger__counter">
            <svg xmlns="http://www.w3.org/2000/svg" width="200" height="200" viewBox="0 0 24 24">
              <path
                fill="currentColor"
                d="M0 1h4.764l.545 2h18.078l-3.666 11H7.78l-.5 2H22v2H4.72l1.246-4.989L3.236 3H0V1Zm7.764 11h10.515l2.334-7H5.855l1.909 7ZM4 21a2 2 0 1 1 4 0a2 2 0 0 1-4 0Zm14 0a2 2 0 1 1 4 0a2 2 0 0 1-4 0Z"
              />
            </svg>
            <div class="counter">1</div>
          </div>
          Cart
        </button>
      </div>
      <button class="burger">
        <span></span>
      </button>
    </header>
    <main class="main">
      <section class="section cart">
        <div class="container">
          <div class="section__header">
            <h2 class="title h2">Cart</h2>
          </div>

          <div class="cart__inner">
            <ul class="cart__list"></ul>

            <div class="cart__total">
              <div class="cart__total-block">
                <h3 class="h3 cart__total-title">Total:</h3>
                <dl class="chars">
                  <div class="chars__item">
                    <dt class="chars__term">Positions</dt>
                    <dd class="chars__val">1</dd>
                  </div>
                  <div class="chars__item">
                    <dt class="chars__term">Total price</dt>
                    <dd class="chars__val">0</dd>
                  </div>
                </dl>
                <button class="btn">Checkout</button>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
